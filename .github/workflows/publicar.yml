# Publica una versión nueva en cada push a main: la web en GitHub Pages
# (https://<usuario>.github.io/<repo>/, para iPhone) y la APK como release de
# GitHub (para Android, que la descarga desde «Acerca de»). Los desarrollos se
# hacen en ramas: llegar a main es publicar.
#
# Una vez: Settings → Pages → Source: «GitHub Actions», y el secreto
# ANDROID_KEYSTORE_BASE64 con la clave de firma (ver CLAUDE.md).
name: Publicar

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Si llegan dos push seguidos, se publica solo el último.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Si los tests fallan no se publica nada y se queda la versión anterior.
  # Con el reporter de GitHub cada fallo sale como anotación en el resumen de
  # la ejecución, que se ve sin abrir el log.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true

      - run: flutter pub get

      - run: flutter test --reporter github

  web:
    needs: test
    runs-on: ubuntu-latest
    steps:
      # Con toda la historia, para contar los commits (número de compilación).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true

      # La web vive en /<repo>/, no en la raíz del dominio.
      - run: >
          flutter build web --release
          --base-href /${{ github.event.repository.name }}/
          --build-number $(git rev-list --count HEAD)

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: web
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  apk:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write # para crear la release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true

      # La app se firma con la clave de depuración del PC del autor, la misma
      # que llevan las APK ya instaladas: sin ella, Android no deja actualizar.
      # build.gradle.kts la lee de ANDROID_KEYSTORE_PATH. (Dejarla en
      # ~/.android/debug.keystore no sirve: en el runner Gradle usa otra.)
      - name: Clave de firma
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::error::Falta el secreto ANDROID_KEYSTORE_BASE64 (ver CLAUDE.md)"
            exit 1
          fi
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/firma.keystore"
          keytool -list -keystore "$RUNNER_TEMP/firma.keystore" -storepass android > /dev/null \
            || { echo "::error::El secreto ANDROID_KEYSTORE_BASE64 no es una clave válida"; exit 1; }
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/firma.keystore" >> "$GITHUB_ENV"

      # El nombre sale de pubspec.yaml y el número de compilación es el de
      # commits: solo sube, y la app compara ese número para avisar.
      - name: Versión
        id: version
        run: |
          echo "name=$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)" >> "$GITHUB_OUTPUT"
          echo "build=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

      - run: flutter build apk --release --build-number ${{ steps.version.outputs.build }}

      - run: cp build/app/outputs/flutter-apk/app-release.apk MTGLifeCounter.apk

      # Antes de publicar, que la firma sea la de siempre: con otra, los
      # móviles no podrían actualizar y quien la instalara se quedaría
      # atascado. Es la huella del certificado, no la clave: no es secreta.
      - name: Comprobar la firma
        env:
          FIRMA_SHA256: e451460b443c697be7cc58b517adff9dd7ed941b0b6d9c28040258e8cee5b889
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          firma=$("$apksigner" verify --print-certs MTGLifeCounter.apk | sed -n 's/.*certificate SHA-256 digest: //p' | head -1)
          echo "Firma de la APK: $firma"
          if [ "$firma" != "$FIRMA_SHA256" ]; then
            echo "::error::La APK no lleva la firma de siempre ($firma): no se publica"
            exit 1
          fi

      # La etiqueta acaba en el número de compilación: la app lo lee de ahí.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}-${{ steps.version.outputs.build }}
          name: ${{ steps.version.outputs.name }} (${{ steps.version.outputs.build }})
          target_commitish: ${{ github.sha }}
          body: ${{ github.event.head_commit.message }}
          files: MTGLifeCounter.apk
          make_latest: true
