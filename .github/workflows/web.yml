# Publica la versión web en GitHub Pages en cada push a main:
# https://<usuario>.github.io/<repo>/
# Hay que activarlo una vez en Settings → Pages → Source: «GitHub Actions».
name: Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Si llegan dos push seguidos, se publica solo el último.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true

      - run: flutter pub get

      # Las fuentes que usa test/layout_test.dart para medir el texto. El SDK
      # de Linux trae material_fonts sin Roboto y marcado como al día, así que
      # sin --force no se vuelve a bajar.
      - run: flutter precache --universal --force

      # Si los tests fallan no se publica nada y se queda la versión anterior.
      # Con el reporter de GitHub cada fallo sale como anotación en el
      # resumen de la ejecución, que se ve sin abrir el log.
      - run: flutter test --reporter github

      # La web vive en /<repo>/, no en la raíz del dominio.
      - run: flutter build web --release --base-href /${{ github.event.repository.name }}/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
